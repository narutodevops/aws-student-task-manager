<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWS Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>AWS Student Task Manager</h1>

        <p>Built using AWS Serverless Architecture</p>

        <div class="input-box">

            <input
                id="taskInput"
                type="text"
                placeholder="Enter a task"
            >

            <button onclick="addTask()">
                Add Task
            </button>

        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
